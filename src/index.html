<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>河北新報 3Dオフィスシミュレーター</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ui.css">
  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <!-- 3Dレンダリング用キャンバスコンテナ -->
  <div id="canvas-container"></div>

  <!-- トランジション（暗転・明転演出用 Canvas） -->
  <canvas id="transition-canvas"></canvas>

  <!-- ログイン・認証オーバーレイ（最前面・不透明グレー背景） -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <h2>河北新報社 3Dオフィス</h2>
        <p>業務統合シミュレーター ポータル</p>
      </div>
      <div class="login-body">
        <label for="login-name">氏名</label>
        <input type="text" id="login-name" placeholder="例: 連絡員 太郎" autocomplete="off">

        <label for="login-pass">認証パスワード</label>
        <input type="password" id="login-pass" placeholder="パスワードを入力">

        <button id="btn-login-submit" class="btn-primary">ログイン</button>
        <div id="login-error-msg" class="error-msg"></div>
      </div>
    </div>
  </div>

  <!-- 最前面 UIレイヤー -->
  <div id="ui-layer">
    <header class="top-nav">
      <!-- 左上: フロア切り替え & 業務フロー -->
      <div class="nav-group" style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="nav-label">フロア:</span>
          <select id="floor-select" class="floor-select">
            <option value="1">1F エントランス・受付・新聞室</option>
            <option value="2">2F 販売部・総務・経理</option>
            <option value="3">3F 編集局・連絡員席</option>
            <option value="4">4F 広告局・メディアセンター</option>
            <option value="5">5F デジタル戦略部・サーバー室</option>
            <option value="6">6F ニュースセンター・編制</option>
            <option value="7">7F 論説委員会・役員室</option>
            <option value="8">8F カフェ・ラウンジ</option>
          </select>
        </div>
        <button id="btn-open-workflow-modal" style="width: fit-content; padding: 5px 14px; background: rgba(2, 132, 199, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.8); border-radius: 16px; font-size: 11px; font-weight: bold; color: #ffffff; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35); pointer-events: auto;">
          📋 業務フロー
        </button>
      </div>

      <!-- 右上: アカウントバッジ & 各種機能 -->
      <div class="nav-group">
        <div id="user-badge-container" class="user-badge">
          <span id="user-display-name">未ログイン</span>
          <button id="btn-account-manage" class="badge-icon-btn" title="アカウント設定">⚙️</button>
        </div>
        <button id="btn-chat-toggle" class="nav-btn chat-btn">💬 チャット</button>
        <button id="btn-return-seat" class="nav-btn seat-btn">💺 自席へ戻る</button>
        <button id="btn-editor-toggle" class="nav-btn edit-btn">✏️ レイアウト</button>
      </div>
    </header>

    <!-- 家具パレットFAB -->
    <button id="btn-open-palette-fab" class="palette-fab" style="display: none;">🪑 家具パレット</button>

    <!-- モバイル用ジョイスティックゾーン -->
    <div id="joystick-zone"></div>

    <!-- ミニマップ -->
    <div id="minimap-container">
      <canvas id="minimap-canvas" width="160" height="120"></canvas>
    </div>

    <!-- チャットドロワー -->
    <div id="chat-drawer" class="chat-drawer closed">
      <div class="chat-header">
        <div class="chat-title">社内チャット (<span id="chat-current-floor-name">6F</span>)</div>
        <button id="btn-chat-close" class="chat-close-btn">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="メッセージを入力...">
        <button id="btn-chat-send" class="btn-primary">送信</button>
      </div>
    </div>
  </div>

  <!-- 家具配置パレットモーダル（カルーセルUI） -->
  <div id="furniture-carousel-modal" class="carousel-modal-overlay" style="display: none;">
    <div class="carousel-card">
      <div class="carousel-header">
        <div class="carousel-title">🪑 家具パレット</div>
        <button id="btn-carousel-close" class="modal-close-icon">✕</button>
      </div>
      <div class="carousel-viewport">
        <button id="btn-carousel-prev" class="carousel-arrow left">◀</button>
        <div id="carousel-preview-container" class="carousel-3d-box"></div>
        <button id="btn-carousel-next" class="carousel-arrow right">▶</button>
      </div>
      <div id="carousel-item-name" class="carousel-name">オフィスデスク</div>
      <button id="btn-carousel-place" class="btn-primary place-btn">この家具を目の前に配置</button>
    </div>
  </div>

  <!-- 汎用インフォメーションモーダル（自席ポータル・辞書・掲示板・業務フロー） -->
  <div id="info-modal" class="modal-overlay">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="modal-title">インフォメーション</h3>
        <button id="modal-close-btn" class="modal-close-icon">✕</button>
      </div>
      <div id="modal-content" class="modal-body">
        内容がここに表示されます。
      </div>
      <div class="modal-footer">
        <button id="modal-ok-btn" class="btn-secondary">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ローディングインジケーター -->
  <div id="loading-spinner" class="loading-overlay" style="display: none;">
    <div class="spinner"></div>
    <div class="loading-text">読み込み中...</div>
  </div>

  <!-- アプリエントリーポイント -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
